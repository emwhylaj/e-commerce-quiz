<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Commerce Exam Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A44;
    --paper: #F6F8FB;
    --card: #FFFFFF;
    --line: #D8DEE8;
    --muted: #5B6679;
    --accent: #2F5BD3;
    --right: #1E7A52;
    --right-bg: #E4F4EC;
    --wrong: #B3261E;
    --wrong-bg: #FBE9E7;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E6EAF2; --paper: #121826; --card: #1A2233; --line: #2E3A52;
      --muted: #9AA6BC; --accent: #7EA2FF; --right: #5FD39E; --right-bg: #173327;
      --wrong: #FF8A80; --wrong-bg: #3A1D1D;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 0; }
  .score { font-size: 0.95rem; color: var(--muted); }
  .score strong { color: var(--ink); }

  .progress { height: 6px; background: var(--line); border-radius: 3px; margin: 1rem 0 1.75rem; overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.5rem; }
  .question { font-family: var(--serif); font-size: 1.3rem; line-height: 1.6; margin: 0 0 1.5rem; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .opt {
    width: 100%; text-align: left; display: flex; gap: 0.85rem; align-items: flex-start;
    font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: 0.85rem 1rem; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt .letter {
    flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 0.9rem;
    border: 2px solid var(--line);
  }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--right); background: var(--right-bg); }
  .opt.right .letter { background: var(--right); border-color: var(--right); color: var(--card); }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: var(--card); }

  .feedback { min-height: 1.5rem; margin: 1rem 0 0; font-weight: 600; }
  .feedback.right { color: var(--right); }
  .feedback.wrong { color: var(--wrong); }

  .nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    padding: 0.7rem 1.2rem; border-radius: 8px;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .tools { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); font-size: 0.9rem; }
  .tools button { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }

  .results h2 { font-family: var(--serif); font-size: 2.5rem; margin: 0.5rem 0; }
  .results p { color: var(--muted); }
  .review { margin-top: 1.5rem; display: grid; gap: 1rem; }
  .review div { background: var(--card); border-left: 4px solid var(--wrong); padding: 0.9rem 1rem; border-radius: 0 8px 8px 0; }
  .review .q { font-family: var(--serif); margin: 0 0 0.4rem; }
  .review .a { margin: 0; font-size: 0.95rem; }
  .review .a span { color: var(--right); font-weight: 700; }

  .tabs { display: flex; gap: 1.5rem; margin-top: 1rem; border-bottom: 2px solid var(--line); }
  .tab {
    font: inherit; font-weight: 600; font-size: 1rem; background: none; border: none; cursor: pointer;
    padding: 0.6rem 0; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:focus-visible, select:focus-visible, textarea:focus-visible, .tools button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .section-name { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin: 0 0 0.25rem; }
  .gap-blank { display: inline-block; width: 4.5em; height: 1.1em; border-bottom: 2px solid var(--accent); margin: 0 0.15em; vertical-align: baseline; }
  .field-label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.4rem; }
  textarea {
    width: 100%; min-height: 5.5rem; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 0.75rem; resize: vertical;
  }
  .answer { background: var(--card); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; padding: 1rem 1.1rem; margin-top: 1rem; }
  .answer h3 { font-size: 0.9rem; margin: 0 0 0.3rem; color: var(--muted); }
  .answer p { margin: 0; }
  .answer .tip { margin-top: 0.6rem; color: var(--muted); font-size: 0.95rem; }
  .selfmark { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
  .btn.good { border-color: var(--right); color: var(--right); }
  .btn.bad { border-color: var(--wrong); color: var(--wrong); }
  .btn.good.on { background: var(--right); color: var(--card); }
  .btn.bad.on { background: var(--wrong); color: var(--card); }
  .tools label { display: flex; align-items: center; gap: 0.4rem; }
  .tools select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.4rem; max-width: 100%; }

  @media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>E-Commerce Exam Practice</h1>
    <div class="score">Score: <strong id="score">0</strong> / <span id="answered">0</span></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mcq" aria-selected="true">Multiple choice</button>
    <button class="tab" role="tab" id="tab-gap" aria-selected="false">Fill in the gap</button>
  </nav>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <section id="quiz" aria-live="polite"></section>
  <section id="gap" aria-live="polite" hidden></section>
</main>

<script>
/* ============================================================
   ADD YOUR QUESTIONS HERE
   Copy one block, paste it at the end of the list, and edit it.
   "answer" is the letter of the correct option: "A", "B", "C" or "D".
   ============================================================ */
const QUESTIONS = [

  },
  {

  },
  {

  {

      "insufficient capacity throughout the backbone",

      "insufficient reach",
      "best-efforts QOS"
    ],
    answer: "C"
  },
  {
    q: "Internet users account for about ______________ of the world's population.",
    options: ["7%", "17%", "27%", "47%"],

  },
  {
    q: "The largest component of a Web site budget is ______________.",
    options: [
      "system maintenance",
      "system development",
      "content design and development",
      "telecommunications"
    ],
    answer: "A"
  },
  {
    q: "The set of standards for communication between a browser and a program running on a server that allows for interaction between the user and the server is known as ______________.",

      "VBScript"

  },
  { q: "The most common type of Internet crime according to the IC3 is ______________.", options: ["Credit card fraud", "Check fraud", "Non-delivery", "Auction fraud"], answer: "D" },
  { q: "When hackers flood a Web site with useless traffic to overwhelm the network, it is called ______________.", options: ["phishing", "pharming", "a Denial of Service (DoS) attack", "spoofing"], answer: "C" },
  { q: "A security plan begins with a(n) ______________.", options: ["security policy", "risk assessment", "implementation plan", "security organization"], answer: "B" },
  { q: "______________ influence the behavior of others through their personality, skills, or other factors.", options: ["Opinion leaders", "Direct reference groups", "Indirect reference groups", "Lifestyle groups"], answer: "A" },
  { q: "A(n) ______________ represents data as two-dimensional tables with records organized in rows and attributes in columns.", options: ["database management system", "data warehouse", "SQL query", "relational database"], answer: "D" },
  { q: "Creating multiple versions of information goods and selling essentially the same product to different market segments at different prices is called ______________.", options: ["versioning", "bundling", "transactive content", "price discrimination"], answer: "A" },
  { q: "Which of the following represents a limiting factor for the growth of e-commerce?", options: ["Persistent cultural attraction of physical markets and traditional shopping experiences", "Inadequate selection of goods compared to physical marketplaces", "E-commerce lacks the convenience of other methods of transacting business", "The potential audience for e-commerce is too low to support it as a widespread method of commerce"], answer: "A" },
  { q: "Which of the following is a measure of the percentage of purchasers who return to a Web site within a year?", options: ["loyalty", "reach", "recency", "unique visitors"], answer: "A" },
  { q: "Which of the following statements about privacy is true?", options: ["It is a moral right to be left alone", "Only corporations and government need to be concerned about it", "It has only just recently become a concern", "It is most easily obtained on the Internet"], answer: "A" },
  { q: "The redirection of traffic from a legitimate site to an infringing site is called ______________.", options: ["cybersquatting", "cyberpiracy", "metatagging", "keywording"], answer: "B" },
  { q: "All of the following are acts Congress has passed or attempted to pass to protect children online except ______________.", options: ["Video Privacy Protection Act", "Children's Online Protection Act", "Communications Decency Act", "Children's Internet Protection Act"], answer: "A" },
  { q: "All of the following are challenges to online retail except ______________.", options: ["Consumer concerns about the security of transactions", "Consumer concerns about the privacy of personal information given to Web sites", "Delays in delivery of goods when compared to store shopping", "Inability to change prices nearly instantly"], answer: "D" },
  { q: "Which of the following is not one of the top three online career service providers?", options: ["CareerBuilder", "Monster", "HotJobs", "USAJobs"], answer: "D" },

  { q: "What is the most commonly offered interactive feature of newspaper Web sites?", options: ["video", "comments on blogs", "RSS feeds", "podcasts"], answer: "C" },
  { q: "All of the following are characteristics of a social network except ______________.", options: ["involves a group of people", "features shared social interaction", "always feature shared goals and purposes", "common ties among members"], answer: "C" },
  { q: "Which of the following is not considered to be a drawback of Internet auctions?", options: ["market inefficiency", "trust risks", "fulfillment costs", "delayed consumption costs"], answer: "A" },

  { q: "All of the following are potential benefits of B2B e-commerce except ______________.", options: ["reduced amount of 'first-mover' advantages", "decreased product cycle time", "increased opportunities for collaborating with suppliers and distributors", "increased production flexibility"], answer: "A" },
  { q: "The two main types of Internet-based B2B commerce are ______________.", options: ["Net marketplaces and private industrial networks", "EDI and collaborative commerce", "Net marketplaces and collaborative commerce", "EDI and private industrial networks"], answer: "D" },
  { q: "______________ are networks that connect people within a company to each other and to the company network.", options: ["Bitstreams", "Extranets", "Internets", "Intranets"], answer: "D" },
  { q: "The type of website that is designed to build customer goodwill and to supplement other sales channels rather than sell the company's products directly is known as a ______________ website.", options: ["marketing", "click-and-mortar", "customer service", "corporate"], answer: "D" },
  { q: "A website offering content created by a third party transparently to customers is an example of ______________.", options: ["Reintermediation", "Syndication", "Virtual Manufacturing", "Build-to-order"], answer: "B" },
  { q: "E-commerce technologies have improved upon traditional commerce technologies in ______________.", options: ["richness", "reach", "both richness and reach", "neither richness nor reach"], answer: "C" },

  { q: "What Web server functionality allows it to verify usernames and passwords and process certificates and encryption information?", options: ["Processing of HTTP requests", "File Transfer Protocol", "Data capture", "Security services"], answer: "D" },
  { q: "The ability to change the product to better fit the needs of the customer is called ______________.", options: ["customization", "personalization", "privacy", "accessibility"], answer: "A" },
  { q: "All of the following are major categories of computer viruses except ______________.", options: ["Macro viruses", "File-infecting viruses", "Script viruses", "Trojan viruses"], answer: "D" },
  { q: "The most widely used encryption standard is ______________.", options: ["Advanced Encryption Standard (AES)", "Data Encryption Standard (DES)", "Universal Encryption Standard (UES)", "Optimal Encryption Standard (OES)"], answer: "A" },
  { q: "The most prevalent online payment method is ______________.", options: ["PayPal", "checks", "credit cards", "debit"], answer: "C" },
  { q: "Complete price transparency in a perfect information marketplace is necessary for ______________ to take effect.", options: ["Bertrand's Law", "the Law of Universal Prices", "the Law of One Price", "the Law of Perfect Commerce"], answer: "C" },
  { q: "The process of getting customers to pass along a company's marketing message to friends, family, and colleagues is known as ______________.", options: ["affiliate marketing", "viral marketing", "permission marketing", "blog marketing"], answer: "B" },
  { q: "E-business can be defined as ______________.", options: ["the uninhibited flow of information and goods on the Web", "the use of the Internet and the Web to transact business", "digitally enabled transactions and processes within an organization", "commercial transactions involving electronic goods"], answer: "C" },
  { q: "All of the following are types of social marketing except ______________.", options: ["affiliate marketing", "blog advertising", "social network advertising", "game advertising"], answer: "A" },

const LETTERS = ["A", "B", "C", "D", "E", "F"];
const $ = (id) => document.getElementById(id);
let order, current, picks;

function start(shuffle) {
  order = QUESTIONS.map((_, i) => i);
  if (shuffle) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  current = 0;
  picks = {};
  render();
}

function stats() {
  const done = Object.keys(picks).map(Number);
  const right = done.filter((i) => picks[i] === QUESTIONS[i].answer.toUpperCase()).length;
  return { done: done.length, right };
}

function updateHeader() {
  const s = stats();
  $("score").textContent = s.right;
  $("answered").textContent = s.done;
  $("bar").style.width = (s.done / QUESTIONS.length * 100) + "%";
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  updateHeader();
  const idx = order[current];
  const item = QUESTIONS[idx];
  const correct = item.answer.toUpperCase();
  const picked = picks[idx];

  const opts = item.options.map((text, i) => {
    const L = LETTERS[i];
    let cls = "";
    if (picked) {
      if (L === correct) cls = "right";
      else if (L === picked) cls = "wrong";
    }
    return `<li><button class="opt ${cls}" data-l="${L}" ${picked ? "disabled" : ""}>
      <span class="letter">${L}</span><span>${esc(text)}</span></button></li>`;
  }).join("");

  let fb = "";
  if (picked) {
    fb = picked === correct
      ? `<p class="feedback right">Correct.</p>`
      : `<p class="feedback wrong">Not quite. The answer is ${correct}: ${esc(item.options[LETTERS.indexOf(correct)])}.</p>`;
  } else {
    fb = `<p class="feedback"></p>`;
  }

  const last = current === order.length - 1;
  $("quiz").innerHTML = `
    <p class="count">Question ${current + 1} of ${order.length}</p>
    <p class="question">${esc(item.q)}</p>
    <ul class="options">${opts}</ul>
    ${fb}
    <div class="nav">
      <button class="btn" id="prev" ${current === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn primary" id="next">${last ? "See results" : "Next question"}</button>
    </div>
    <div class="tools">
      <button id="shuffle">Start over, shuffled</button>
      <button id="restart">Start over, in order</button>
    </div>
    <p class="hint">Keyboard: press A–D to answer, ← and → to move.</p>`;

  document.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => choose(b.dataset.l)));
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => (last ? results() : go(1));
  $("shuffle").onclick = () => start(true);
  $("restart").onclick = () => start(false);
}

function choose(L) {
  const idx = order[current];
  if (picks[idx] || LETTERS.indexOf(L) >= QUESTIONS[idx].options.length) return;
  picks[idx] = L;
  render();
  $("next").focus();
}

function go(step) {
  current = Math.min(Math.max(current + step, 0), order.length - 1);
  render();
}

function results() {
  updateHeader();
  const s = stats();
  const pct = Math.round(s.right / QUESTIONS.length * 100);
  const missed = order.filter((i) => picks[i] !== QUESTIONS[i].answer.toUpperCase());
  const review = missed.map((i) => {
    const it = QUESTIONS[i];
    const c = it.answer.toUpperCase();
    const yours = picks[i] ? `You picked ${picks[i]}. ` : "Skipped. ";
    return `<div><p class="q">${esc(it.q)}</p>
      <p class="a">${yours}Answer: <span>${c}. ${esc(it.options[LETTERS.indexOf(c)])}</span></p></div>`;
  }).join("");

  $("quiz").innerHTML = `
    <div class="results">
      <p class="count">Your result</p>
      <h2>${s.right} / ${QUESTIONS.length}</h2>
      <p>${pct}% correct${s.done < QUESTIONS.length ? `, ${QUESTIONS.length - s.done} skipped` : ""}.</p>
      ${missed.length ? `<h3>Questions to review</h3><div class="review">${review}</div>` : "<p>Every question right.</p>"}
      <div class="nav">
        <button class="btn primary" id="shuffle">Try again, shuffled</button>
        <button class="btn" id="restart">Try again, in order</button>
      </div>
    </div>`;
  $("shuffle").onclick = () => start(true);
  $("restart").onclick = () => start(false);
}

let gOrder = [], gCur = 0, gMarks = {}, gShown = {}, gDrafts = {}, gFilter = 0;

function gStart(shuffle, only) {
  gOrder = only || GAP.map((_, i) => i).filter((i) => !gFilter || GAP[i].s === gFilter);
  if (shuffle) {
    for (let i = gOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [gOrder[i], gOrder[j]] = [gOrder[j], gOrder[i]];
    }
  }
  gCur = 0; gMarks = {}; gShown = {}; gDrafts = {};
  gRender();
}

function gHeader() {
  const ids = Object.keys(gMarks);
  $("score").textContent = ids.filter((i) => gMarks[i]).length;
  $("answered").textContent = ids.length;
  $("bar").style.width = (gOrder.length ? ids.length / gOrder.length * 100 : 0) + "%";
}

function withBlanks(t) {
  return esc(t).replace(/_{3,}/g, '<span class="gap-blank" role="img" aria-label="blank"></span>');
}

function gRender() {
  gHeader();
  const idx = gOrder[gCur], it = GAP[idx], shown = gShown[idx], mark = gMarks[idx];
  const last = gCur === gOrder.length - 1;
  const sections = `<option value="0">All sections</option>` + Object.entries(GAP_SECTIONS)
    .map(([k, v]) => `<option value="${k}" ${Number(k) === gFilter ? "selected" : ""}>${esc(v)}</option>`).join("");

  const answerBlock = shown
    ? `<div class="answer"><h3>Answer</h3><p>${esc(it.a)}</p>${it.m ? `<p class="tip">Memory tip: ${esc(it.m)}</p>` : ""}</div>
       <div class="selfmark">
         <button class="btn good ${mark === true ? "on" : ""}" id="got">I got it</button>
         <button class="btn bad ${mark === false ? "on" : ""}" id="missed">I missed it</button>
       </div>`
    : `<div class="selfmark"><button class="btn primary" id="reveal">Show answer</button></div>`;

  $("gap").innerHTML = `
    <p class="section-name">${esc(GAP_SECTIONS[it.s] || "")}</p>
    <p class="count">Question ${gCur + 1} of ${gOrder.length}</p>
    <p class="question">${withBlanks(it.q)}</p>
    <label class="field-label" for="attempt">Your answer (optional, for practice)</label>
    <textarea id="attempt" placeholder="Type what goes in the blanks">${esc(gDrafts[idx] || "")}</textarea>
    ${answerBlock}
    <div class="nav">
      <button class="btn" id="gprev" ${gCur === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn ${shown ? "primary" : ""}" id="gnext">${last ? "See results" : "Next question"}</button>
    </div>
    <div class="tools">
      <label>Section <select id="gsec">${sections}</select></label>
      <button id="gshuffle">Start over, shuffled</button>
      <button id="grestart">Start over, in order</button>
    </div>
    <p class="hint">Write your answer, tap Show answer, then mark yourself honestly.</p>`;

  $("attempt").oninput = (e) => { gDrafts[idx] = e.target.value; };
  if (shown) {
    $("got").onclick = () => { gMarks[idx] = true; gRender(); $("gnext").focus(); };
    $("missed").onclick = () => { gMarks[idx] = false; gRender(); $("gnext").focus(); };
  } else {
    $("reveal").onclick = () => { gShown[idx] = true; gRender(); $("got").focus(); };
  }
  $("gprev").onclick = () => gGo(-1);
  $("gnext").onclick = () => (last ? gResults() : gGo(1));
  $("gsec").onchange = (e) => { gFilter = Number(e.target.value); gStart(false); };
  $("gshuffle").onclick = () => gStart(true);
  $("grestart").onclick = () => gStart(false);
}

function gGo(step) {
  gCur = Math.min(Math.max(gCur + step, 0), gOrder.length - 1);
  gRender();
}

function gResults() {
  gHeader();
  const right = gOrder.filter((i) => gMarks[i] === true).length;
  const unmarked = gOrder.filter((i) => gMarks[i] === undefined).length;
  const missed = gOrder.filter((i) => gMarks[i] !== true);
  const review = missed.map((i) => {
    const it = GAP[i];
    const note = gMarks[i] === false ? "Missed. " : "Not marked. ";
    return `<div><p class="q">${withBlanks(it.q)}</p><p class="a">${note}Answer: <span>${esc(it.a)}</span></p></div>`;
  }).join("");

  $("gap").innerHTML = `
    <div class="results">
      <p class="count">Your result</p>
      <h2>${right} / ${gOrder.length}</h2>
      <p>${Math.round(right / gOrder.length * 100)}% marked correct${unmarked ? `, ${unmarked} not marked` : ""}.</p>
      ${missed.length ? `<h3>Questions to review</h3><div class="review">${review}</div>` : "<p>Every question right.</p>"}
      <div class="nav">
        ${missed.length ? `<button class="btn primary" id="gmissed">Practice the ${missed.length} missed</button>` : ""}
        <button class="btn" id="gshuffle">Try again, shuffled</button>
        <button class="btn" id="grestart">Try again, in order</button>
      </div>
    </div>`;
  if (missed.length) $("gmissed").onclick = () => gStart(true, missed.slice());
  $("gshuffle").onclick = () => gStart(true);
  $("grestart").onclick = () => gStart(false);
}

/* ---------- Tabs ---------- */
let mode = "mcq";
function showMode(m) {
  mode = m;
  $("tab-mcq").setAttribute("aria-selected", m === "mcq");
  $("tab-gap").setAttribute("aria-selected", m === "gap");
  $("quiz").hidden = m !== "mcq";
  $("gap").hidden = m !== "gap";
  if (m === "mcq") render(); else gRender();
}
$("tab-mcq").onclick = () => showMode("mcq");
$("tab-gap").onclick = () => showMode("gap");

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, select")) return;
  if (mode === "gap") {
    if (e.key === "ArrowRight") gGo(1);
    else if (e.key === "ArrowLeft") gGo(-1);
    return;
  }
  if (!$("prev")) return;
  const k = e.key.toUpperCase();
  if (["A", "B", "C", "D"].includes(k)) choose(k);
  else if (["1", "2", "3", "4"].includes(k)) choose(LETTERS[Number(k) - 1]);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});

start(false);
gStart(false);
showMode("mcq");
</script>
</body>
</html>
