<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Commerce Exam Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A44;
    --paper: #F6F8FB;
    --card: #FFFFFF;
    --line: #D8DEE8;
    --muted: #5B6679;
    --accent: #2F5BD3;
    --right: #1E7A52;
    --right-bg: #E4F4EC;
    --wrong: #B3261E;
    --wrong-bg: #FBE9E7;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E6EAF2; --paper: #121826; --card: #1A2233; --line: #2E3A52;
      --muted: #9AA6BC; --accent: #7EA2FF; --right: #5FD39E; --right-bg: #173327;
      --wrong: #FF8A80; --wrong-bg: #3A1D1D;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 0; }
  .score { font-size: 0.95rem; color: var(--muted); }
  .score strong { color: var(--ink); }

  .progress { height: 6px; background: var(--line); border-radius: 3px; margin: 1rem 0 1.75rem; overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.5rem; }
  .question { font-family: var(--serif); font-size: 1.3rem; line-height: 1.6; margin: 0 0 1.5rem; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .opt {
    width: 100%; text-align: left; display: flex; gap: 0.85rem; align-items: flex-start;
    font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: 0.85rem 1rem; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt .letter {
    flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 0.9rem;
    border: 2px solid var(--line);
  }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--right); background: var(--right-bg); }
  .opt.right .letter { background: var(--right); border-color: var(--right); color: var(--card); }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: var(--card); }

  .feedback { min-height: 1.5rem; margin: 1rem 0 0; font-weight: 600; }
  .feedback.right { color: var(--right); }
  .feedback.wrong { color: var(--wrong); }

  .nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    padding: 0.7rem 1.2rem; border-radius: 8px;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .tools { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); font-size: 0.9rem; }
  .tools button { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }

  .results h2 { font-family: var(--serif); font-size: 2.5rem; margin: 0.5rem 0; }
  .results p { color: var(--muted); }
  .review { margin-top: 1.5rem; display: grid; gap: 1rem; }
  .review div { background: var(--card); border-left: 4px solid var(--wrong); padding: 0.9rem 1rem; border-radius: 0 8px 8px 0; }
  .review .q { font-family: var(--serif); margin: 0 0 0.4rem; }
  .review .a { margin: 0; font-size: 0.95rem; }
  .review .a span { color: var(--right); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>E-Commerce Exam Practice</h1>
    <div class="score">Score: <strong id="score">0</strong> / <span id="answered">0</span></div>
  </header>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <section id="quiz" aria-live="polite"></section>
</main>

<script>
/* ============================================================

  { q: "Which of the following is a measure of the percentage of purchasers who return to a Web site within a year?", options: ["loyalty", "reach", "recency", "unique visitors"], answer: "A" },

/* ============================================================ */

const LETTERS = ["A", "B", "C", "D", "E", "F"];
const $ = (id) => document.getElementById(id);
let order, current, picks;

function start(shuffle) {
  order = QUESTIONS.map((_, i) => i);
  if (shuffle) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  current = 0;
  picks = {};
  render();
}

function stats() {
  const done = Object.keys(picks).map(Number);
  const right = done.filter((i) => picks[i] === QUESTIONS[i].answer.toUpperCase()).length;
  return { done: done.length, right };
}

function updateHeader() {
  const s = stats();
  $("score").textContent = s.right;
  $("answered").textContent = s.done;
  $("bar").style.width = (s.done / QUESTIONS.length * 100) + "%";
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  updateHeader();
  const idx = order[current];
  const item = QUESTIONS[idx];
  const correct = item.answer.toUpperCase();
  const picked = picks[idx];

  const opts = item.options.map((text, i) => {
    const L = LETTERS[i];
    let cls = "";
    if (picked) {
      if (L === correct) cls = "right";
      else if (L === picked) cls = "wrong";
    }
    return `<li><button class="opt ${cls}" data-l="${L}" ${picked ? "disabled" : ""}>
      <span class="letter">${L}</span><span>${esc(text)}</span></button></li>`;
  }).join("");

  let fb = "";
  if (picked) {
    fb = picked === correct
      ? `<p class="feedback right">Correct.</p>`
      : `<p class="feedback wrong">Not quite. The answer is ${correct}: ${esc(item.options[LETTERS.indexOf(correct)])}.</p>`;
  } else {
    fb = `<p class="feedback"></p>`;
  }

  const last = current === order.length - 1;
  $("quiz").innerHTML = `
    <p class="count">Question ${current + 1} of ${order.length}</p>
    <p class="question">${esc(item.q)}</p>
    <ul class="options">${opts}</ul>
    ${fb}
    <div class="nav">
      <button class="btn" id="prev" ${current === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn primary" id="next">${last ? "See results" : "Next question"}</button>
    </div>
    <div class="tools">
      <button id="shuffle">Start over, shuffled</button>
      <button id="restart">Start over, in order</button>
    </div>
    <p class="hint">Keyboard: press A–D to answer, ← and → to move.</p>`;

  document.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => choose(b.dataset.l)));
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => (last ? results() : go(1));
  $("shuffle").onclick = () => start(true);
  $("restart").onclick = () => start(false);
}

function choose(L) {
  const idx = order[current];
  if (picks[idx] || LETTERS.indexOf(L) >= QUESTIONS[idx].options.length) return;
  picks[idx] = L;
  render();
  $("next").focus();
}

function go(step) {
  current = Math.min(Math.max(current + step, 0), order.length - 1);
  render();
}

function results() {
  updateHeader();
  const s = stats();
  const pct = Math.round(s.right / QUESTIONS.length * 100);
  const missed = order.filter((i) => picks[i] !== QUESTIONS[i].answer.toUpperCase());
  const review = missed.map((i) => {
    const it = QUESTIONS[i];
    const c = it.answer.toUpperCase();
    const yours = picks[i] ? `You picked ${picks[i]}. ` : "Skipped. ";
    return `<div><p class="q">${esc(it.q)}</p>
      <p class="a">${yours}Answer: <span>${c}. ${esc(it.options[LETTERS.indexOf(c)])}</span></p></div>`;
  }).join("");

  $("quiz").innerHTML = `
    <div class="results">
      <p class="count">Your result</p>
      <h2>${s.right} / ${QUESTIONS.length}</h2>
      <p>${pct}% correct${s.done < QUESTIONS.length ? `, ${QUESTIONS.length - s.done} skipped` : ""}.</p>
      ${missed.length ? `<h3>Questions to review</h3><div class="review">${review}</div>` : "<p>Every question right.</p>"}
      <div class="nav">
        <button class="btn primary" id="shuffle">Try again, shuffled</button>
        <button class="btn" id="restart">Try again, in order</button>
      </div>
    </div>`;
  $("shuffle").onclick = () => start(true);
  $("restart").onclick = () => start(false);
}

document.addEventListener("keydown", (e) => {
  if (!$("prev")) return;
  const k = e.key.toUpperCase();
  if (["A", "B", "C", "D"].includes(k)) choose(k);
  else if (["1", "2", "3", "4"].includes(k)) choose(LETTERS[Number(k) - 1]);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});

start(false);
</script>
