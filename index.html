<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Commerce Exam Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A44;
    --paper: #F6F8FB;
    --card: #FFFFFF;
    --line: #D8DEE8;
    --muted: #5B6679;
    --accent: #2F5BD3;
    --right: #1E7A52;
    --right-bg: #E4F4EC;
    --wrong: #B3261E;
    --wrong-bg: #FBE9E7;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E6EAF2; --paper: #121826; --card: #1A2233; --line: #2E3A52;
      --muted: #9AA6BC; --accent: #7EA2FF; --right: #5FD39E; --right-bg: #173327;
      --wrong: #FF8A80; --wrong-bg: #3A1D1D;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 0; }
  .score { font-size: 0.95rem; color: var(--muted); }
  .score strong { color: var(--ink); }

  .progress { height: 6px; background: var(--line); border-radius: 3px; margin: 1rem 0 1.75rem; overflow: hidden; }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.5rem; }
  .question { font-family: var(--serif); font-size: 1.3rem; line-height: 1.6; margin: 0 0 1.5rem; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .opt {
    width: 100%; text-align: left; display: flex; gap: 0.85rem; align-items: flex-start;
    font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 10px;
    padding: 0.85rem 1rem; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt .letter {
    flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: 0.9rem;
    border: 2px solid var(--line);
  }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--right); background: var(--right-bg); }
  .opt.right .letter { background: var(--right); border-color: var(--right); color: var(--card); }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: var(--card); }

  .feedback { min-height: 1.5rem; margin: 1rem 0 0; font-weight: 600; }
  .feedback.right { color: var(--right); }
  .feedback.wrong { color: var(--wrong); }

  .nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    padding: 0.7rem 1.2rem; border-radius: 8px;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .tools { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); font-size: 0.9rem; }
  .tools button { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }

  .results h2 { font-family: var(--serif); font-size: 2.5rem; margin: 0.5rem 0; }
  .results p { color: var(--muted); }
  .review { margin-top: 1.5rem; display: grid; gap: 1rem; }
  .review div { background: var(--card); border-left: 4px solid var(--wrong); padding: 0.9rem 1rem; border-radius: 0 8px 8px 0; }
  .review .q { font-family: var(--serif); margin: 0 0 0.4rem; }
  .review .a { margin: 0; font-size: 0.95rem; }
  .review .a span { color: var(--right); font-weight: 700; }

  .tabs { display: flex; gap: 1.5rem; margin-top: 1rem; border-bottom: 2px solid var(--line); overflow-x: auto; }
  .tab { white-space: nowrap; flex: none; }
  .tab {
    font: inherit; font-weight: 600; font-size: 1rem; background: none; border: none; cursor: pointer;
    padding: 0.6rem 0; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:focus-visible, select:focus-visible, textarea:focus-visible, .tools button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .section-name { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin: 0 0 0.25rem; }
  .gap-blank { display: inline-block; width: 4.5em; height: 1.1em; border-bottom: 2px solid var(--accent); margin: 0 0.15em; vertical-align: baseline; }
  .field-label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.4rem; }
  textarea {
    width: 100%; min-height: 5.5rem; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 0.75rem; resize: vertical;
  }
  .answer { background: var(--card); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; padding: 1rem 1.1rem; margin-top: 1rem; }
  .answer h3 { font-size: 0.9rem; margin: 0 0 0.3rem; color: var(--muted); }
  .answer p { margin: 0; }
  .answer .tip { margin-top: 0.6rem; color: var(--muted); font-size: 0.95rem; }
  .selfmark { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
  .btn.good { border-color: var(--right); color: var(--right); }
  .btn.bad { border-color: var(--wrong); color: var(--wrong); }
  .btn.good.on { background: var(--right); color: var(--card); }
  .btn.bad.on { background: var(--wrong); color: var(--card); }
  .tools label { display: flex; align-items: center; gap: 0.4rem; }
  .tools select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.4rem; max-width: 100%; }

  @media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }

/* ── PAST QUESTIONS ── */
#pq{padding:0 0 60px}
.pq-year-block{margin-bottom:48px}
.pq-year-heading{font-size:1.25rem;font-weight:700;color:var(--ink);padding:16px 20px;background:var(--card);border-radius:12px 12px 0 0;border-bottom:3px solid var(--accent);font-family:var(--serif,inherit);background:var(--card)}
.pq-year-meta{font-size:0.78rem;color:var(--muted);background:var(--card);padding:6px 20px 14px;margin-bottom:16px}
.pq-section-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);margin:20px 0 10px;padding:0 2px}
.pq-note{background:var(--paper);border-radius:10px;padding:14px 18px;margin-bottom:14px;font-size:0.85rem;color:var(--muted);border:1px dashed currentColor}
.pq-card{background:var(--card);border-radius:12px;padding:22px;margin-bottom:14px;border:1px solid rgba(0,0,0,0.07)}
.pq-q-num{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:7px}
.pq-q-text{font-size:1rem;font-weight:600;line-height:1.55;color:var(--ink);margin-bottom:14px}
.pq-toggle-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:0.83rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit}
.pq-toggle-btn:hover,.pq-toggle-btn.on{background:var(--accent);color:#fff}
.pq-answer{margin-top:16px;padding:18px 20px;background:#ffffff;border-radius:10px;border-left:4px solid var(--accent);border:1px solid var(--line);font-size:0.9rem;line-height:1.85;color:#1F2A44;display:none}
.pq-answer.show{display:block;animation:pqIn 0.2s ease}
@keyframes pqIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.pq-answer h4{font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);margin:0 0 10px;font-family:var(--sans)} .pq-answer strong{color:#1F2A44} .pq-answer ol{padding-left:20px;margin:0 0 9px;color:#1F2A44} .pq-answer ol li{margin-bottom:5px;color:#1F2A44}
.pq-answer p{margin:0 0 9px;color:#1F2A44}.pq-answer p:last-child{margin:0;color:#1F2A44}
.pq-answer ul{padding-left:20px;margin:0 0 9px;color:#1F2A44}
.pq-answer li{margin-bottom:5px;color:#1F2A44}
.pq-kp{margin-top:14px;padding:12px 16px;background:#fffbeb;border-radius:8px;border:1px solid #fcd34d}
.pq-kp h5{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#d97706;margin:0 0 7px}
.pq-kp ul{padding-left:17px;margin:0}
.pq-kp li{font-size:0.8rem;color:#92400e;margin-bottom:3px}
.pq-reveal-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;margin-bottom:14px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit}
.pq-reveal-btn:hover,.pq-reveal-btn.done{background:var(--accent);color:#fff}
.pq-obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-bottom:8px}
.pq-fib-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pq-fib-list{display:flex;flex-direction:column;gap:0;margin-bottom:8px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.pq-fib-item{background:var(--card);border-bottom:1px solid var(--line)}
.pq-fib-item:last-child{border-bottom:none}
.pq-fib-row{display:flex;align-items:flex-start;gap:10px;padding:11px 14px}
.pq-fib-num{flex-shrink:0;font-size:0.72rem;font-weight:800;color:var(--muted);min-width:22px;padding-top:2px;text-align:right}
.pq-fib-q{flex:1;font-size:0.88rem;font-weight:500;color:var(--ink);line-height:1.55}
.pq-fib-btn{flex-shrink:0;padding:4px 12px;border-radius:5px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:0.75rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit;white-space:nowrap;align-self:center}
.pq-fib-btn:hover,.pq-fib-btn-on{background:var(--accent);color:#fff}
.pq-fib-ans{display:none;padding:8px 14px 11px 46px;font-size:0.85rem;font-weight:700;color:#2f5bd3;border-top:1px solid var(--line);background:#eef2ff;line-height:1.5}
.pq-fib-ans.show{display:block;animation:pqIn 0.15s ease}
.pq-mcq-list{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.pq-mcq-item{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:16px 18px}
.pq-mcq-qnum{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:6px}
.pq-mcq-qtext{font-size:0.92rem;font-weight:600;color:var(--ink);line-height:1.55;margin-bottom:12px}
.pq-mcq-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.pq-mcq-opt{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;text-align:left;font-family:inherit;font-size:0.86rem;color:var(--ink);transition:all 0.15s}
.pq-mcq-opt:hover:not(:disabled){border-color:var(--accent);background:#eef2ff}
.pq-mcq-key{flex-shrink:0;width:22px;height:22px;border-radius:5px;background:var(--line);color:var(--muted);font-weight:800;font-size:0.72rem;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.pq-mcq-text{flex:1;line-height:1.45;color:inherit}
.pq-mcq-opt-correct{border-color:#1E7A52 !important;background:#E4F4EC !important;color:#0f3d28 !important}
.pq-mcq-opt-correct .pq-mcq-key{background:#1E7A52;color:#fff}
.pq-mcq-opt-wrong{border-color:#B3261E !important;background:#FBE9E7 !important;color:#4a0f0b !important}
.pq-mcq-opt-wrong .pq-mcq-key{background:#B3261E;color:#fff}
.pq-mcq-opt-dim{opacity:0.45}
.pq-mcq-opt:disabled{cursor:default}
.pq-mcq-fb{margin-top:4px;padding:12px 14px;border-radius:8px;background:#f0f4ff;border:1px solid #c7d4f0;font-size:0.85rem;line-height:1.6;color:#1F2A44}
.pq-mcq-fb-label{font-size:0.82rem;font-weight:800;margin-bottom:6px}
.pq-mcq-fb-right{color:#1E7A52}
.pq-mcq-fb-wrong{color:#B3261E}
.pq-mcq-fb-exp{color:#1F2A44;margin-bottom:5px}
.pq-mcq-fb-ans{font-size:0.8rem;color:#475569}
.pq-mcq-fb-ans strong{color:#1F2A44}
.pq-mcq-retry{display:none;align-items:center;gap:5px;margin-top:8px;padding:6px 14px;border-radius:6px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s}
.pq-mcq-retry:hover{background:var(--accent);color:#fff}
.pq-mcq-opt-correct .pq-mcq-text{color:#0f3d28 !important}
.pq-mcq-opt-wrong .pq-mcq-text{color:#4a0f0b !important}
.pq-mcq-opt-correct .pq-mcq-key{background:#1E7A52;color:#fff}
.pq-mcq-opt-wrong .pq-mcq-key{background:#B3261E;color:#fff}
.pq-mcq-fb-label{font-size:0.82rem;font-weight:800;margin-bottom:6px}
.pq-obj-item{background:var(--card);border-radius:8px;padding:12px 14px;border:1px solid rgba(0,0,0,0.07);font-size:0.83rem}
.pq-obj-q{color:var(--ink);font-weight:500;margin-bottom:5px;white-space:pre-line}
.pq-obj-ans{font-size:0.8rem;font-weight:700;color:#1d4ed8;display:none}
.pq-obj-ans.show{display:block}

/* ── PREDICTIONS PANEL ── */
#pred{padding:0 0 60px}
.pred-hero{background:linear-gradient(135deg,#1a2e4a 0%,#2f5bd3 100%);border-radius:14px;padding:28px 28px 24px;margin-bottom:28px;color:#fff}
.pred-hero h2{font-size:1.3rem;font-weight:800;margin-bottom:6px;font-family:var(--serif)}
.pred-hero p{font-size:0.88rem;color:rgba(255,255,255,0.75);line-height:1.6;max-width:600px}
.pred-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pred-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700}
.pred-badge-high{background:rgba(220,38,38,0.2);color:#fca5a5;border:1px solid rgba(220,38,38,0.3)}
.pred-badge-med{background:rgba(217,119,6,0.2);color:#fcd34d;border:1px solid rgba(217,119,6,0.3)}
.pred-badge-low{background:rgba(22,163,74,0.2);color:#86efac;border:1px solid rgba(22,163,74,0.3)}
.pred-disclaimer{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin-bottom:24px;font-size:0.82rem;color:#92400e;line-height:1.6}
.pred-group{margin-bottom:32px}
.pred-group-title{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.pred-card{background:var(--card);border-radius:12px;padding:20px 22px;margin-bottom:12px;border:1px solid var(--line);border-left:4px solid var(--line)}
.pred-card-high{border-left-color:#dc2626}
.pred-card-med{border-left-color:#d97706}
.pred-card-low{border-left-color:#16a34a}
.pred-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.pred-q{font-size:0.97rem;font-weight:700;color:var(--ink);line-height:1.5;flex:1}
.pred-prob{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:0.72rem;font-weight:800;flex-shrink:0;white-space:nowrap}
.pred-prob-high{background:#fee2e2;color:#dc2626}
.pred-prob-med{background:#fef3c7;color:#d97706}
.pred-prob-low{background:#dcfce7;color:#16a34a}
.pred-rationale{font-size:0.83rem;color:var(--muted);line-height:1.6;margin-bottom:10px}
.pred-hint-toggle{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:6px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:0.75rem;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit}
.pred-hint-toggle:hover,.pred-hint-toggle.on{background:var(--accent);color:#fff}
.pred-hint{display:none;margin-top:12px;padding:14px 16px;background:#f0f5ff;border-radius:8px;border-left:3px solid var(--accent);font-size:0.85rem;line-height:1.75;color:#1F2A44}
.pred-hint.show{display:block;animation:pqIn 0.2s ease}
.pred-hint h4{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);margin-bottom:8px}
.pred-hint ul{padding-left:18px;margin:0 0 8px}
.pred-hint li{margin-bottom:4px}
.pred-hint p{margin-bottom:6px}
.pred-hint p:last-child{margin:0}
.pred-source{margin-top:8px;font-size:0.75rem;color:var(--muted)}
.pred-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.pred-stat{background:var(--card);border-radius:10px;padding:14px;text-align:center;border:1px solid var(--line)}
.pred-stat-num{font-size:1.6rem;font-weight:800;font-family:var(--serif)}
.pred-stat-lbl{font-size:0.72rem;color:var(--muted);margin-top:2px}
.pred-stat-num.high{color:#dc2626}
.pred-stat-num.med{color:#d97706}
.pred-stat-num.low{color:#16a34a}

</style>
</head>
<body>
<main>
  <header>
    <h1>E-Commerce Exam Practice</h1>
    <div class="score">Score: <strong id="score">0</strong> / <span id="answered">0</span></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mcq" aria-selected="true">Multiple choice</button>
    <button class="tab" role="tab" id="tab-gap" aria-selected="false">Fill in the gap</button>
    <button class="tab" role="tab" id="tab-ger" aria-selected="false">German questions</button>
    <button class="tab" role="tab" id="tab-pq" aria-selected="false">&#128221; Past Questions</button>
    <button class="tab" role="tab" id="tab-pred" aria-selected="false">&#127919; Predictions</button>
  </nav>
  <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  <section id="quiz" aria-live="polite"></section>
  <section id="gap" aria-live="polite" hidden></section>
  <section id="ger" aria-live="polite" hidden></section>
  <section id="pq" hidden><div id="pqContainer"></div></section>
  <section id="pred" hidden><div id="predContainer"></div></section>
</main>

<script>
/* ============================================================
   ADD YOUR QUESTIONS HERE
   Copy one block, paste it at the end of the list, and edit it.
   "answer" is the letter of the correct option: "A", "B", "C" or "D".
   ============================================================ */
const QUESTIONS = [
  {
    q: "The dimension of e-commerce that enables commerce across national boundaries is called ______________.",
    options: ["interactivity", "global reach", "richness", "ubiquity"],
    answer: "B"
  },
  {
    q: "The primary source of financing during the early years of e-commerce was ______________.",
    options: ["bank loans", "large retail firms", "venture capital funds", "initial public offerings"],
    answer: "C"
  },
  {
    q: "The source of revenue in a subscription revenue model is ______________.",
    options: [
      "Fees from advertisers in exchange for advertisements",
      "Fees for business referrals",
      "Fees from subscribers in exchange for access to content or services",
      "Fees for enabling or executing a transaction"
    ],
    answer: "C"
  },
  {
    q: "Industry structure is defined as ______________.",
    options: [
      "the nature of the players in an industry and their relative bargaining power",
      "a set of plans for achieving long term returns on the capital invested in a business firm",
      "a set of planned activities designed to result in a profit in a marketplace",
      "how a company's product or service fulfills the needs of customers"
    ],
    answer: "A"

const LETTERS = ["A", "B", "C", "D", "E", "F"];
const $ = (id) => document.getElementById(id);

/* ---------- Sets of 50 (shared by all tabs) ---------- */
const SET_SIZE = 50;
const SAVE_KEY = "ecommerce-practice-sets";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { saved = {}; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saved)); } catch (e) { /* storage unavailable */ } }
function setCount(n) { return Math.max(1, Math.ceil(n / SET_SIZE)); }
function setRange(k, n) { return `questions ${k * SET_SIZE + 1}–${Math.min((k + 1) * SET_SIZE, n)}`; }
function setLabel(k, n) { return `Set ${k + 1} of ${setCount(n)}: ${setRange(k, n)}`; }
function setOptions(k, n) {
  let o = "";
  for (let i = 0; i < setCount(n); i++) o += `<option value="${i}" ${i === k ? "selected" : ""}>Set ${i + 1} (${setRange(i, n).replace("questions ", "")})</option>`;
  return o;
}
function clampSet(k, n) { return Number.isInteger(k) && k >= 0 && k < setCount(n) ? k : 0; }
function shuffleInPlace(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Multiple choice ---------- */
let order, current, picks;
let mcqSet = clampSet(saved.mcq, QUESTIONS.length);

function start(shuffle) {
  mcqSet = clampSet(mcqSet, QUESTIONS.length);
  order = QUESTIONS.map((_, i) => i).slice(mcqSet * SET_SIZE, (mcqSet + 1) * SET_SIZE);
  if (shuffle) shuffleInPlace(order);
  current = 0;
  picks = {};
  saved.mcq = mcqSet; save();
  render();
}

function stats() {
  const done = Object.keys(picks).map(Number);
  const right = done.filter((i) => picks[i] === QUESTIONS[i].answer.toUpperCase()).length;
  return { done: done.length, right };
}

function updateHeader() {
  const s = stats();
  $("score").textContent = s.right;
  $("answered").textContent = s.done;
  $("bar").style.width = (s.done / order.length * 100) + "%";
}

function esc(t) {
  return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  updateHeader();
  const idx = order[current];
  const item = QUESTIONS[idx];
  const correct = item.answer.toUpperCase();
  const picked = picks[idx];

  const opts = item.options.map((text, i) => {
    const L = LETTERS[i];
    let cls = "";
    if (picked) {
      if (L === correct) cls = "right";
      else if (L === picked) cls = "wrong";
    }
    return `<li><button class="opt ${cls}" data-l="${L}" ${picked ? "disabled" : ""}>
      <span class="letter">${L}</span><span>${esc(text)}</span></button></li>`;
  }).join("");

  let fb = "";
  if (picked) {
    fb = picked === correct
      ? `<p class="feedback right">Correct.</p>`
      : `<p class="feedback wrong">Not quite. The answer is ${correct}: ${esc(item.options[LETTERS.indexOf(correct)])}.</p>`;
  } else {
    fb = `<p class="feedback"></p>`;
  }

  const last = current === order.length - 1;
  $("quiz").innerHTML = `
    <p class="section-name">${setLabel(mcqSet, QUESTIONS.length)}</p>
    <p class="count">Question ${current + 1} of ${order.length}</p>
    <p class="question">${esc(item.q)}</p>
    <ul class="options">${opts}</ul>
    ${fb}
    <div class="nav">
      <button class="btn" id="prev" ${current === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn primary" id="next">${last ? "See results" : "Next question"}</button>
    </div>
    <div class="tools">
      <label>Set <select id="mset">${setOptions(mcqSet, QUESTIONS.length)}</select></label>
      <button id="shuffle">Start over, shuffled</button>
      <button id="restart">Start over, in order</button>
    </div>
    <p class="hint">Keyboard: press A–D to answer, ← and → to move.</p>`;

  document.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => choose(b.dataset.l)));
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => (last ? results() : go(1));
  $("mset").onchange = (e) => { mcqSet = Number(e.target.value); start(false); };
  $("shuffle").onclick = () => start(true);
  $("restart").onclick = () => start(false);
}

function choose(L) {
  const idx = order[current];
  if (picks[idx] || LETTERS.indexOf(L) >= QUESTIONS[idx].options.length) return;
  picks[idx] = L;
  render();
  $("next").focus();
}

function go(step) {
  current = Math.min(Math.max(current + step, 0), order.length - 1);
  render();
}

function results() {
  updateHeader();
  const s = stats();
  const total = order.length;
  const pct = Math.round(s.right / total * 100);
  const missed = order.filter((i) => picks[i] !== QUESTIONS[i].answer.toUpperCase());
  const review = missed.map((i) => {
    const it = QUESTIONS[i];
    const c = it.answer.toUpperCase();
    const yours = picks[i] ? `You picked ${picks[i]}. ` : "Skipped. ";
    return `<div><p class="q">${esc(it.q)}</p>
      <p class="a">${yours}Answer: <span>${c}. ${esc(it.options[LETTERS.indexOf(c)])}</span></p></div>`;
  }).join("");
  const hasNext = mcqSet < setCount(QUESTIONS.length) - 1;

  $("quiz").innerHTML = `
    <div class="results">
      <p class="section-name">${setLabel(mcqSet, QUESTIONS.length)}</p>
      <p class="count">Your result</p>
      <h2>${s.right} / ${total}</h2>
      <p>${pct}% correct${s.done < total ? `, ${total - s.done} skipped` : ""}.</p>
      ${missed.length ? `<h3>Questions to review</h3><div class="review">${review}</div>` : "<p>Every question right.</p>"}
      <div class="nav">
        ${hasNext ? `<button class="btn primary" id="nextset">Next set: ${setRange(mcqSet + 1, QUESTIONS.length)}</button>` : ""}
        <button class="btn ${hasNext ? "" : "primary"}" id="shuffle">Redo this set, shuffled</button>
        <button class="btn" id="restart">Redo this set, in order</button>
      </div>
    </div>`;
  if (hasNext) $("nextset").onclick = () => { mcqSet += 1; start(false); };
  $("shuffle").onclick = () => start(true);
  $("restart").onclick = () => start(false);
}

/* ---------- Fill-in-the-gap engine (shared by both gap tabs) ---------- */
const BANKS = {
  gap: { data: GAP, sections: GAP_SECTIONS, label: "Section", all: "All sections" },
  ger: { data: GERMAN, sections: GERMAN_SECTIONS, label: "Chapter", all: "All chapters" }
};
for (const [key, b] of Object.entries(BANKS)) {
  const sv = saved[key] || {};
  Object.assign(b, { order: [], cur: 0, marks: {}, shown: {}, drafts: {}, review: false,
    filter: b.sections[sv.filter] ? sv.filter : 0, set: Number.isInteger(sv.set) ? sv.set : 0, baseLen: 0 });
}

function withBlanks(t) {
  return esc(t).replace(/_{3,}/g, '<span class="gap-blank" role="img" aria-label="blank"></span>');
}

function gStart(key, shuffle, only) {
  const b = BANKS[key];
  const base = b.data.map((_, i) => i).filter((i) => !b.filter || b.data[i].s === b.filter);
  b.baseLen = base.length;
  b.set = clampSet(b.set, base.length);
  b.review = Boolean(only);
  b.order = only || base.slice(b.set * SET_SIZE, (b.set + 1) * SET_SIZE);
  if (shuffle) shuffleInPlace(b.order);
  saved[key] = { set: b.set, filter: b.filter }; save();
  b.cur = 0; b.marks = {}; b.shown = {}; b.drafts = {};
  gRender(key);
}

function gHeader(key) {
  const b = BANKS[key], ids = Object.keys(b.marks);
  $("score").textContent = ids.filter((i) => b.marks[i]).length;
  $("answered").textContent = ids.length;
  $("bar").style.width = (b.order.length ? ids.length / b.order.length * 100 : 0) + "%";
}

function gRender(key) {
  const b = BANKS[key], el = $(key), id = (n) => `${key}-${n}`;
  gHeader(key);
  const idx = b.order[b.cur], it = b.data[idx], shown = b.shown[idx], mark = b.marks[idx];
  const last = b.cur === b.order.length - 1;
  const sections = `<option value="0">${b.all}</option>` + Object.entries(b.sections)
    .map(([k, v]) => `<option value="${k}" ${Number(k) === b.filter ? "selected" : ""}>${esc(v)}</option>`).join("");
  const draft = (b.drafts[idx] || "").trim();

  const answerBlock = shown
    ? `<div class="answer"><h3>Answer</h3><p>${esc(it.a)}</p>
         ${draft ? `<p class="tip">You wrote: ${esc(draft)}</p>` : ""}
         ${it.m ? `<p class="tip">Memory tip: ${esc(it.m)}</p>` : ""}</div>
       <div class="selfmark">
         <button class="btn good ${mark === true ? "on" : ""}" id="${id("got")}">I got it</button>
         <button class="btn bad ${mark === false ? "on" : ""}" id="${id("missed")}">I missed it</button>
       </div>`
    : `<div class="selfmark"><button class="btn primary" id="${id("reveal")}">Show answer</button></div>`;

  el.innerHTML = `
    <p class="section-name">${b.review ? "Reviewing missed questions" : setLabel(b.set, b.baseLen)}</p>
    <p class="count">${esc(b.sections[it.s] || "")}</p>
    <p class="count">Question ${b.cur + 1} of ${b.order.length}</p>
    <p class="question">${withBlanks(it.q)}</p>
    <label class="field-label" for="${id("attempt")}">Your answer (optional, for practice)</label>
    <textarea id="${id("attempt")}" placeholder="Type what goes in the blanks">${esc(b.drafts[idx] || "")}</textarea>
    ${answerBlock}
    <div class="nav">
      <button class="btn" id="${id("prev")}" ${b.cur === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn ${shown ? "primary" : ""}" id="${id("next")}">${last ? "See results" : "Next question"}</button>
    </div>
    <div class="tools">
      <label>Set <select id="${id("set")}">${setOptions(b.set, b.baseLen)}</select></label>
      <label>${b.label} <select id="${id("sec")}">${sections}</select></label>
      <button id="${id("shuffle")}">Start over, shuffled</button>
      <button id="${id("restart")}">Start over, in order</button>
    </div>
    <p class="hint">Write your answer, tap Show answer, then mark yourself honestly.</p>`;

  $(id("attempt")).oninput = (e) => { b.drafts[idx] = e.target.value; };
  if (shown) {
    $(id("got")).onclick = () => { b.marks[idx] = true; gRender(key); $(id("next")).focus(); };
    $(id("missed")).onclick = () => { b.marks[idx] = false; gRender(key); $(id("next")).focus(); };
  } else {
    $(id("reveal")).onclick = () => { b.shown[idx] = true; gRender(key); $(id("got")).focus(); };
  }
  $(id("prev")).onclick = () => gGo(key, -1);
  $(id("next")).onclick = () => (last ? gResults(key) : gGo(key, 1));
  $(id("set")).onchange = (e) => { b.set = Number(e.target.value); gStart(key, false); };
  $(id("sec")).onchange = (e) => { b.filter = Number(e.target.value); b.set = 0; gStart(key, false); };
  $(id("shuffle")).onclick = () => gStart(key, true);
  $(id("restart")).onclick = () => gStart(key, false);
}

function gGo(key, step) {
  const b = BANKS[key];
  if (!$(`${key}-prev`)) return;
  b.cur = Math.min(Math.max(b.cur + step, 0), b.order.length - 1);
  gRender(key);
}

function gResults(key) {
  const b = BANKS[key], id = (n) => `${key}-${n}`;
  gHeader(key);
  const right = b.order.filter((i) => b.marks[i] === true).length;
  const unmarked = b.order.filter((i) => b.marks[i] === undefined).length;
  const missed = b.order.filter((i) => b.marks[i] !== true);
  const review = missed.map((i) => {
    const it = b.data[i];
    const note = b.marks[i] === false ? "Missed. " : "Not marked. ";
    return `<div><p class="q">${withBlanks(it.q)}</p><p class="a">${note}Answer: <span>${esc(it.a)}</span></p></div>`;
  }).join("");
  const hasNext = !b.review && b.set < setCount(b.baseLen) - 1;

  $(key).innerHTML = `
    <div class="results">
      <p class="section-name">${b.review ? "Reviewing missed questions" : setLabel(b.set, b.baseLen)}</p>
      <p class="count">Your result</p>
      <h2>${right} / ${b.order.length}</h2>
      <p>${Math.round(right / b.order.length * 100)}% marked correct${unmarked ? `, ${unmarked} not marked` : ""}.</p>
      ${missed.length ? `<h3>Questions to review</h3><div class="review">${review}</div>` : "<p>Every question right.</p>"}
      <div class="nav">
        ${hasNext ? `<button class="btn primary" id="${id("nextset")}">Next set: ${setRange(b.set + 1, b.baseLen)}</button>` : ""}
        ${missed.length ? `<button class="btn ${hasNext ? "" : "primary"}" id="${id("missedonly")}">Practice the ${missed.length} missed</button>` : ""}
        <button class="btn" id="${id("shuffle")}">Redo this set, shuffled</button>
        <button class="btn" id="${id("restart")}">Redo this set, in order</button>
      </div>
    </div>`;
  if (hasNext) $(id("nextset")).onclick = () => { b.set += 1; gStart(key, false); };
  if (missed.length) $(id("missedonly")).onclick = () => gStart(key, true, missed.slice());
  $(id("shuffle")).onclick = () => gStart(key, true);
  $(id("restart")).onclick = () => gStart(key, false);
}

/* ── Render function ── */
function renderPQ() {
  var container = document.getElementById('pqContainer');
  if (!container) return;
  var html = '';

  PQ_DATA.forEach(function(exam) {
    html += '<div class="pq-year-block">';
    html += '<div class="pq-year-heading">&#128197; ' + exam.year + ' Past Examination</div>';
    html += '<div class="pq-year-meta">' + exam.course + ' &mdash; University of Lagos, Dept. of Computer Sciences</div>';

    exam.sections.forEach(function(section) {
      html += '<div class="pq-section-label">' + section.label + '</div>';

      if (section.type === 'fib_mcq') {
        html += '<div class="pq-note">' + section.note + '</div>';
        var fmid = 'fibmcq_' + exam.year.replace(/[\s\/]/g,'_');
        html += '<div class="pq-mcq-list" id="' + fmid + '">';
        section.questions.forEach(function(q, i) {
          var uid = fmid + '_' + i;
          html += '<div class="pq-mcq-item" id="mcqItem_' + uid + '">';
          html += '<div class="pq-mcq-qnum">Q' + (i + 1) + '</div>';
          html += '<div class="pq-mcq-qtext">' + pqEsc(q.q) + '</div>';
          html += '<div class="pq-mcq-opts" id="opts_' + uid + '">';
          q.opts.forEach(function(opt) {
            var letter = opt.charAt(0).toUpperCase();
            var text   = opt.slice(3);
            html += '<button class="pq-mcq-opt" data-uid="' + uid + '" data-letter="' + letter + '" data-correct="' + q.a + '" onclick="pqMCQPick(this)">';
            html += '<span class="pq-mcq-key">' + letter + '</span>';
            html += '<span class="pq-mcq-text">' + pqEsc(text) + '</span>';
            html += '</button>';
          });
          html += '</div>';
          html += '<div class="pq-mcq-fb" id="fb_' + uid + '" style="display:none">';
          html += '<div class="pq-mcq-fb-label" id="fblabel_' + uid + '"></div>';
          html += '<div class="pq-mcq-fb-exp">' + pqEsc(q.e) + '</div>';
          html += '</div>';
          html += '<button class="pq-mcq-retry" id="retry_' + uid + '" onclick="pqMCQRetry(\'' + uid + '\')" style="display:none">↺ Try Again</button>';
          html += '</div>';
        });
        html += '</div>';

      } else if (section.type === 'mcq_pq') {
        html += '<div class="pq-note">' + section.note + '</div>';
        var mid = 'mcq_' + exam.year.replace(/[\s\/]/g,'_');
        html += '<div class="pq-mcq-list" id="' + mid + '">';
        section.questions.forEach(function(q, i) {
          var uid = mid + '_' + i;
          // Parse correct letter from answer field e.g. "C — Alibaba" -> "C"
          var correctLetter = q.a.charAt(0).toUpperCase();
          // Parse options from question text - split on newline, options are after first line
          var lines = q.q.split('\n');
          var qText = lines[0];
          // Parse options: match (a) text (b) text etc. from remaining lines
          var optionText = lines.slice(1).join(' ');
          var optMatches = optionText.match(/\(([a-dA-D])\)\s*([^(]+?)(?=\s*\([a-dA-D]\)|$)/g) || [];
          var opts = {};
          optMatches.forEach(function(m) {
            var match = m.match(/\(([a-dA-D])\)\s*(.+)/);
            if (match) opts[match[1].toUpperCase()] = match[2].trim();
          });
          html += '<div class="pq-mcq-item" id="mcqItem_' + uid + '">';
          html += '<div class="pq-mcq-qnum">Q' + (i+1) + '</div>';
          html += '<div class="pq-mcq-qtext">' + pqEsc(qText) + '</div>';
          html += '<div class="pq-mcq-opts" id="opts_' + uid + '">';
          var letters = ['A','B','C','D'];
          letters.forEach(function(letter) {
            if (opts[letter]) {
              html += '<button class="pq-mcq-opt" data-uid="' + uid + '" data-letter="' + letter + '" data-correct="' + correctLetter + '" onclick="pqMCQPick(this)">';
              html += '<span class="pq-mcq-key">' + letter + '</span>';
              html += '<span class="pq-mcq-text">' + pqEsc(opts[letter]) + '</span>';
              html += '</button>';
            }
          });
          html += '</div>';
          html += '<div class="pq-mcq-fb" id="fb_' + uid + '" style="display:none">';
          html += '<div class="pq-mcq-fb-label" id="fblabel_' + uid + '"></div>';
          html += '<div class="pq-mcq-fb-exp">' + pqEsc(q.e) + '</div>';
          html += '<div class="pq-mcq-fb-ans">Correct answer: <strong>' + pqEsc(q.a) + '</strong></div>';
          html += '</div>';
          html += '<button class="pq-mcq-retry" id="retry_' + uid + '" onclick="pqMCQRetry(\'' + uid + '\')" style="display:none">&#8635; Try Again</button>';
          html += '</div>';
        });
        html += '</div>';

      } else {
        section.questions.forEach(function(q) {
          var uid = 'eq_' + exam.year.replace(/[\s\/]/g,'_') + '_' + q.num.replace(/\s/g,'');
          html += '<div class="pq-card">';
          html += '<div class="pq-q-num">' + q.num + ' &mdash; ' + exam.year + '</div>';
          html += '<div class="pq-q-text">' + pqEsc(q.text) + '</div>';
          html += '<button class="pq-toggle-btn" id="btn_' + uid + '" onclick="pqToggle(\'' + uid + '\')">&#128065; Show Model Answer</button>';
          html += '<div class="pq-answer" id="ans_' + uid + '">' + q.ans;
          if (q.kp && q.kp.length) {
            html += '<div class="pq-kp"><h5>&#9989; Key Points</h5><ul>';
            q.kp.forEach(function(k) { html += '<li>' + pqEsc(k) + '</li>'; });
            html += '</ul></div>';
          }
          html += '</div></div>';
        });
      }
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

function pqToggle(uid) {
  var box = document.getElementById('ans_' + uid);
  var btn = document.getElementById('btn_' + uid);
  if (!box || !btn) return;
  var on = box.classList.toggle('show');
  btn.classList.toggle('on', on);
  btn.innerHTML = on ? '&#128065; Hide Model Answer' : '&#128065; Show Model Answer';
}

function pqReveal(gid) {
  var grid = document.getElementById(gid);
  if (!grid) return;
  grid.querySelectorAll('.pq-obj-ans').forEach(function(el) { el.classList.add('show'); });
  var btn = document.getElementById('rb_' + gid);
  if (btn) { btn.textContent = '✔ Answers Revealed'; btn.classList.add('done'); }
}

function pqToggleFib(iid) {
  var ans = document.getElementById(iid);
  var btn = document.getElementById('fibBtn_' + iid);
  if (!ans || !btn) return;
  var showing = ans.classList.toggle('show');
  btn.textContent = showing ? 'Hide' : 'Show';
  btn.classList.toggle('pq-fib-btn-on', showing);
}

function pqRevealAll(gid) {
  var list = document.getElementById(gid);
  if (!list) return;
  list.querySelectorAll('.pq-fib-ans').forEach(function(el) { el.classList.add('show'); });
  list.querySelectorAll('.pq-fib-btn').forEach(function(b) { b.textContent = 'Hide'; b.classList.add('pq-fib-btn-on'); });
  var rb = document.getElementById('rb_' + gid);
  if (rb) { rb.classList.add('done'); }
}

function pqHideAll(gid) {
  var list = document.getElementById(gid);
  if (!list) return;
  list.querySelectorAll('.pq-fib-ans').forEach(function(el) { el.classList.remove('show'); });
  list.querySelectorAll('.pq-fib-btn').forEach(function(b) { b.textContent = 'Show'; b.classList.remove('pq-fib-btn-on'); });
  var rb = document.getElementById('rb_' + gid);
  if (rb) { rb.classList.remove('done'); }
}

function pqMCQPick(btn) {
  var uid     = btn.dataset.uid;
  var chosen  = btn.dataset.letter;
  var correct = btn.dataset.correct;
  var isRight = chosen === correct;

  // Lock all option buttons
  var opts = document.querySelectorAll('[data-uid="' + uid + '"]');
  opts.forEach(function(b) {
    b.disabled = true;
    var l = b.dataset.letter;
    if (l === correct) {
      b.classList.add('pq-mcq-opt-correct');
    } else if (l === chosen && !isRight) {
      b.classList.add('pq-mcq-opt-wrong');
    } else {
      b.classList.add('pq-mcq-opt-dim');
    }
  });

  // Show feedback
  var fb = document.getElementById('fb_' + uid);
  var label = document.getElementById('fblabel_' + uid);
  if (fb && label) {
    label.textContent = isRight ? '✔ Correct!' : '✘ Incorrect';
    label.className = 'pq-mcq-fb-label ' + (isRight ? 'pq-mcq-fb-right' : 'pq-mcq-fb-wrong');
    fb.style.display = 'block';
  }

  // Show retry button if wrong
  if (!isRight) {
    var retry = document.getElementById('retry_' + uid);
    if (retry) retry.style.display = 'inline-flex';
  }
}

function pqMCQRetry(uid) {
  // Re-enable all options and hide feedback
  var opts = document.querySelectorAll('[data-uid="' + uid + '"]');
  opts.forEach(function(b) {
    b.disabled = false;
    b.classList.remove('pq-mcq-opt-correct','pq-mcq-opt-wrong','pq-mcq-opt-dim');
  });
  var fb = document.getElementById('fb_' + uid);
  if (fb) fb.style.display = 'none';
  var retry = document.getElementById('retry_' + uid);
  if (retry) retry.style.display = 'none';
}

/* ── Wire up the Past Questions tab ── */
(function() {
  var tabPQ   = document.getElementById('tab-pq');
  var panelPQ = document.getElementById('pq');
  if (!tabPQ || !panelPQ) return;

  tabPQ.addEventListener('click', function() {
    document.querySelectorAll('.tab[role="tab"]').forEach(function(t) {
      t.setAttribute('aria-selected', 'false');
    });
    ['quiz','gap','ger','pred'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.hidden = true;
    });
    tabPQ.setAttribute('aria-selected', 'true');
    panelPQ.hidden = false;
    if (!panelPQ.dataset.rendered) {
      renderPQ();
      panelPQ.dataset.rendered = '1';
    }
  });
})();

function renderPred() {

  if (!container) return;

  var highCount = 0, medCount = 0, lowCount = 0;
  PREDICTIONS.forEach(function(g) {

      if (item.probClass === 'high') highCount++;
      else if (item.probClass === 'med') medCount++;
      else lowCount++;

  var html = '';

  html += '<div class="pred-hero">';
  html += '<h2>Exam Predictions for MIT808</h2>';
  html += '<p>Based on pattern analysis of the 2021/2022 and 2024 past papers — identifying which textbook topics have been consistently avoided as theory questions. All predictions and hints are based strictly on the uploaded textbook by Prof. Adewole A.P.</p>';
  html += '<div class="pred-legend">';
  html += '<span class="pred-badge pred-badge-high">&#128308; Very High Probability</span>';
  html += '<span class="pred-badge pred-badge-med">&#128992; High Probability</span>';
  html += '<span class="pred-badge pred-badge-low">&#128994; Medium Probability</span>';
  html += '</div>';
  html += '</div>';

  html += '<div class="pred-disclaimer">&#9888;&#65039; <strong>Important:</strong> These are educated predictions based on topic gap analysis, not guaranteed exam content. Use them to guide your revision priorities. Study all topics thoroughly — the examiner can always return to previously tested areas with a different angle.</div>';

  html += '<div class="pred-stats-row">';
  html += '<div class="pred-stat"><div class="pred-stat-num high">' + highCount + '</div><div class="pred-stat-lbl">Very High / High</div></div>';
  html += '<div class="pred-stat"><div class="pred-stat-num med">' + medCount + '</div><div class="pred-stat-lbl">Medium Probability</div></div>';
  html += '<div class="pred-stat"><div class="pred-stat-num low">' + lowCount + '</div><div class="pred-stat-lbl">Lower Probability</div></div>';
  html += '</div>';

  PREDICTIONS.forEach(function(group) {
    html += '<div class="pred-group">';
    html += '<div class="pred-group-title">' + pqEsc(group.group) + '</div>';

    group.items.forEach(function(item, i) {
      var uid = 'pred_' + group.groupClass + '_' + i;
      html += '<div class="pred-card pred-card-' + item.probClass + '">';
      html += '<div class="pred-card-top">';
      html += '<div class="pred-q">' + pqEsc(item.q) + '</div>';
      html += '<span class="pred-prob pred-prob-' + item.probClass + '">' + pqEsc(item.prob) + '</span>';
      html += '</div>';
      html += '<div class="pred-rationale">' + pqEsc(item.rationale) + '</div>';
      html += '<button class="pred-hint-toggle" id="phbtn_' + uid + '" onclick="predToggle(\'' + uid + '\')">&#128161; Show Answer Hints</button>';
      html += '<div class="pred-hint" id="ph_' + uid + '">' + item.hint;
      html += '<div class="pred-source">Source: ' + pqEsc(item.source) + '</div>';
      html += '</div>';
      html += '</div>';
    });

    html += '</div>';
  });

  container.innerHTML = html;
}

function predToggle(uid) {
  var hint = document.getElementById('ph_' + uid);
  var btn  = document.getElementById('phbtn_' + uid);
  if (!hint || !btn) return;
  var on = hint.classList.toggle('show');
  btn.classList.toggle('on', on);
  btn.innerHTML = on ? '&#128161; Hide Answer Hints' : '&#128161; Show Answer Hints';
}

(function() {
  var tabPred   = document.getElementById('tab-pred');
  var panelPred = document.getElementById('pred');
  if (!tabPred || !panelPred) return;

  tabPred.addEventListener('click', function() {
    document.querySelectorAll('.tab[role="tab"]').forEach(function(t) {
      t.setAttribute('aria-selected', 'false');
    });
    ['quiz','gap','ger','pq'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.hidden = true;

      panelPred.dataset.rendered = '1';
